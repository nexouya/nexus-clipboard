[package]
name = "nexus-clipboard"
version = "1.1.0"
description = "Nexus Clipboard — a god-level clipboard manager"
authors = ["Nexus"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["image-data"] }
argon2 = "0.5.3"
base64 = "0.23.0"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
image = { version = "0.25.6", features = ["png", "jpeg", "webp"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = { version = "0.9.5", features = ["std", "std_rng"] }
regex = "1.13.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "http2", "rustls", "charset"] }
rusqlite = { version = "0.40.1", features = ["bundled", "blob", "functions", "serde_json", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["derive"] }
zip = "4.2.0"

# Windows API bindings are only needed on Windows; keeping them out of the
# Linux dependency closure keeps Linux builds lean.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Synthesises the Ctrl+V paste keystroke. Only the pure-Rust x11rb backend is
# enabled so no extra C libraries (libxdo) are required at build time.
enigo = { version = "0.3.0", default-features = false, features = ["x11rb"] }
# Pure-Rust X11 client used for active-window introspection.
x11rb = { version = "0.13.1", default-features = false, features = ["allow-unsafe-code"] }
# Wayland protocol querying and DBus client for GNOME / KDE / Freedesktop portals
zbus = { version = "5.5.0", default-features = false, features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
incremental = true
